app-id: io.github.BioVisualizer.Rectifex
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: start.sh

build-options:
  build-args:
    - --share=network

finish-args:
  - --share=network
  - --device=dri
  - --socket=x11
  - --env=DISPLAY=$DISPLAY
  - --filesystem=xdg-data/icons
  - --filesystem=xdg-config/rectifex:create
  - --filesystem=~/.cache/com.rectifex.GlobalScreener:create

modules:
  - name: python3-deps
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-user --no-build-isolation -r requirements.txt
    sources:
      - type: file
        path: requirements.txt

  - name: rectifex-app
    buildsystem: simple
    build-commands:
      # Copy the new application structure
      - cp -r app core cli assets /app/
      # Install license and startup script
      - install -D -t /app/share/licenses/io.github.BioVisualizer.Rectifex/ LICENSE
      - install -D -m 755 start.sh /app/bin/start.sh
      # Install desktop integration files
      - install -D -t /app/share/applications/ app/share/applications/io.github.BioVisualizer.Rectifex.desktop
      - install -D -t /app/share/metainfo/ app/share/metainfo/io.github.BioVisualizer.Rectifex.appdata.xml
      - install -D -t /app/share/icons/hicolor/scalable/apps/ app/share/icons/hicolor/scalable/apps/io.github.BioVisualizer.Rectifex.svg
      # Update icon cache
      - gtk-update-icon-cache -f -t /app/share/icons/hicolor
    sources:
      - type: dir
        path: .